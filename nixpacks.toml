[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
depends = ["setup"]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
depends = ["install"]
cmds = [
  ". /opt/venv/bin/activate && cd frontend && npm run build"
]

[start]
cmd = ". /opt/venv/bin/activate && python run.py"
