services:
  - type: web
    name: suchka-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: python api.py & python main.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.6-plus-preview:free
      - key: DEV_MODE
        value: "false"
    healthCheckPath: /health
    autoDeploy: true
